[package]
name = "shuffle"
version = "0.4.0"
edition = "2021"
description = "Shuffle — a fast, snappy file manager for Apple Silicon Macs"
publish = false

[dependencies]
gpui = "0.2.2"
chrono = "0.4"
# Parallel fuzzy scoring of the in-memory file index.
rayon = "1"
# Fast parallel directory walking for index builds.
jwalk = "0.8"
# Decode the TIFF that NSImage hands us for file-type icons.
image = { version = "0.25", features = ["tiff"] }
# Fetch real macOS file icons via NSWorkspace (Apple Silicon / AppKit).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSFileManager", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPDFImageRep", "NSGraphics", "NSGraphicsContext", "NSResponder", "NSView", "NSEvent", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSSharingService"] }
# macOS file-op syscalls: renamex_np(RENAME_EXCL), copyfile, clonefile, F_FULLFSYNC.
libc = "0.2"
# Reach the underlying NSView so we can start native OS drag sessions (drag files out to Finder/other apps).
raw-window-handle = "0.6"
# In-process QuickLook thumbnails for the preview pane (replaces spawning qlmanage).
objc2-quick-look-thumbnailing = "0.3"
block2 = "0.6"
# Text/code preview: syntax highlighting (pure-Rust regex engine, no oniguruma).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Markdown preview.
pulldown-cmark = { version = "0.13", default-features = false }

# Ships as a universal binary (arm64 + x86_64) via release.sh so it runs on
# both Apple Silicon and Intel Macs. Build with a thin release profile while
# we iterate; we can tune this later.
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
